# Facility 0.12 — persistent story workspaces, MCP-first, single host.
#   SECRET_MASTER_KEY=$(openssl rand -base64 32) docker compose up -d
# For a real deployment, front web+api with TLS and use managed Postgres.
name: facility

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: facility
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facility}
      POSTGRES_DB: facility
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facility"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., target: api }
    command:
      [
        "sh",
        "-c",
        "FACILITY_SEED_DEMO=0 node node_modules/@facility/db/dist/bin/deploy.js",
      ]
    environment:
      DATABASE_URL: postgres://facility:${POSTGRES_PASSWORD:-facility}@postgres:5432/facility
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Build the default persistent workspace image before the control plane starts.
  # This one-shot service never runs an agent; it only makes the image available
  # to the host Docker daemon used by api/worker.
  runner-image:
    build: { context: ., dockerfile: runner/Dockerfile }
    image: ${FACILITY_WORKSPACE_IMAGE:-facility-runner:dev}
    entrypoint: ["/bin/true"]
    restart: "no"

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://facility:${POSTGRES_PASSWORD:-facility}@postgres:5432/facility
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:?set SECRET_MASTER_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4400}
      WEB_URL: ${WEB_URL:-http://localhost:3400}
      FACILITY_PREVIEW_URL: ${FACILITY_PREVIEW_URL:-http://preview.localhost:4400}
      AUTH_IDENTITY_PROVIDER: ${AUTH_IDENTITY_PROVIDER:-github}
      AUTH_CALLBACK_URL: ${AUTH_CALLBACK_URL:-http://localhost:3400/api/auth/callback}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_ALLOWED_ORGANIZATION: ${GITHUB_OAUTH_ALLOWED_ORGANIZATION:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      FACILITY_INSTANCE_ID: ${FACILITY_INSTANCE_ID:-}
      FACILITY_OAUTH_ISSUER: ${FACILITY_OAUTH_ISSUER:-http://localhost:3400}
      FACILITY_OAUTH_JWKS: ${FACILITY_OAUTH_JWKS:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:4400/mcp}
      # GitHub App (repo automation): webhooks 401 and clone-token minting fail
      # without these; doctor flags them when repo automation is enabled.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_CLONE_TOKEN: ${GITHUB_CLONE_TOKEN:-}
      FACILITY_WORKSPACE_DRIVER: docker
      FACILITY_WORKSPACE_IMAGE: ${FACILITY_WORKSPACE_IMAGE:-facility-runner:dev}
    ports: ["4400:4400"]
    volumes:
      # The API inspects workspace state through the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }
      runner-image: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4400/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build: { context: ., target: api }
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://facility:${POSTGRES_PASSWORD:-facility}@postgres:5432/facility
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:?set SECRET_MASTER_KEY}
      FACILITY_PREVIEW_URL: ${FACILITY_PREVIEW_URL:-http://preview.localhost:4400}
      # The worker dispatches turns, so it mints repository credentials and needs
      # the same GitHub App env as the api (installation-token minting + fallback).
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_CLONE_TOKEN: ${GITHUB_CLONE_TOKEN:-}
      # The Docker provider launches persistent workspaces on the host daemon.
      FACILITY_WORKSPACE_DRIVER: docker
      FACILITY_WORKSPACE_IMAGE: ${FACILITY_WORKSPACE_IMAGE:-facility-runner:dev}
    volumes:
      # Workspace volumes outlive these API and worker containers.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }
      runner-image: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      FACILITY_API_URL: http://api:4400
    ports: ["3400:3400"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3400/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api: { condition: service_healthy }

volumes:
  pg:
