# npm publication has two deliberately separate entry points:
#
# - A manual run is always a credential-free dry run. There is no input that
#   can turn it into a release.
# - ci.yml calls this workflow from a public push of main, only after every
#   acceptance job passes and only when the commit subjects decided a version.
#   Keeping publication in that original run gives npm provenance the tested
#   commit rather than a downstream identity.
#
# The first public release needs a granular npm token in the protected `npm`
# environment as NPM_BOOTSTRAP_TOKEN. After that one publish, configure npm
# trusted publishing for ci.yml + the `npm` environment, revoke/delete the
# bootstrap token, and disallow token publishing.
# Actions are pinned to full SHAs (guards/actions-pinned.mjs enforces it).
name: release

on:
  workflow_call:
    inputs:
      version:
        description: The version decided from the commits, stamped into the archive
        type: string
        required: true
    outputs:
      published:
        description: Whether npm's immutable version namespace was consumed
        value: ${{ jobs.publish.outputs.published }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test the CLI
        run: pnpm --filter @theagilemonkeys/facility test

      - name: Pack, install, and dry-run the exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/facility-release"
          smoke_dir="$RUNNER_TEMP/facility-release-smoke"
          mkdir -p "$release_dir" "$smoke_dir"
          tarball="$(cd packages/cli && npm pack --ignore-scripts --pack-destination "$release_dir")"
          candidate="$release_dir/$tarball"
          node scripts/release.mjs artifact "$candidate"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts --silent "$candidate"
          ./node_modules/.bin/facility --help
          cd "$GITHUB_WORKSPACE"
          node scripts/release.mjs dry-run "$candidate"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: npm-theagilemonkeys-facility
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment: npm
    outputs:
      published: ${{ steps.publication.outputs.published }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Job filesystems are isolated. Reapply the version used to build the
      # accepted tarball before validating it against this fresh checkout.
      - name: Stamp the decided version
        run: node scripts/release.mjs stamp "${{ inputs.version }}"

      - name: Install the trusted-publishing npm client
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"

      - name: Download the accepted release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: facility-release-package
          path: ${{ runner.temp }}/facility-release

      # Same reason as ci.yml's validate step: the visibility the policy checks
      # has to be passed in, or the revalidation refuses a public release.
      - name: Revalidate the release and its artifact
        id: candidate
        shell: bash
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          FACILITY_RELEASE_VERSION="${{ inputs.version }}" node scripts/release.mjs validate
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/facility-release/"*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one release tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          node scripts/release.mjs artifact "${tarballs[0]}"
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      # This lookup is unauthenticated and fails closed on network errors,
      # malformed metadata, and any response other than an exact package 404
      # or valid existing-package document.
      - name: Determine the allowed authentication path
        id: registry
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: node scripts/release.mjs registry-state "$CANDIDATE"

      - name: Publish with npm trusted publishing
        id: oidc
        if: steps.registry.outputs.state == 'existing'
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: node scripts/release.mjs publish "$CANDIDATE" --auth=oidc

      # The environment secret is materialized only on the exact first-publish
      # branch. The helper probes the unauthenticated registry twice more before
      # spawning npm, preventing token fallback for existing packages or
      # uncertain registry state.
      - name: Bootstrap the package once with a granular token
        id: bootstrap
        if: steps.registry.outputs.state == 'missing'
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: node scripts/release.mjs publish "$CANDIDATE" --auth=bootstrap

      # A version is consumed when an identical artifact already exists or
      # when the matching authentication branch published it successfully.
      # Export that fact instead of asking the caller to infer it from a job
      # result, because skipped reusable jobs can still report success.
      - name: Record the consumed npm version
        id: publication
        if: >-
          !cancelled()
          && steps.registry.outcome == 'success'
          && (
            steps.registry.outputs.state == 'published'
            || (steps.registry.outputs.state == 'existing' && steps.oidc.outcome == 'success')
            || (steps.registry.outputs.state == 'missing' && steps.bootstrap.outcome == 'success')
          )
        run: echo 'published=true' >> "$GITHUB_OUTPUT"
