# CI for the Facility monorepo. Root verification is deliberately release-shaped:
# uncached builds, direct critical integration suites, guards, and a high-severity
# dependency gate. Clean Compose and Docker-backed sandbox paths are separate jobs.
# Actions are pinned to full SHAs (guards/actions-pinned.mjs enforces it here too).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A release decision is a read of shared tag state. Serialize main pushes at
# the workflow boundary so a later merge cannot decide from that state until
# the prior merge has either recorded its release or failed visibly.
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the commit subjects since the last release add up to. Runs first so
  # every publishing job can gate on one answer instead of recomputing it.
  decide-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decision.outputs.release }}
      version: ${{ steps.decision.outputs.version }}
      tag: ${{ steps.decision.outputs.tag }}
      notes: ${{ steps.decision.outputs.notes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: decision
        run: node scripts/version.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Release-shaped verification
        run: pnpm verify

  # Stamp the decided version and build the archive once, in a job with no
  # credentials. The npm environment later receives this exact, already-tested
  # archive rather than running package lifecycle code with publication rights.
  # The stamp is never committed: the tag written at the end is the record.
  package-release:
    needs: [decide-release, verify]
    if: needs.decide-release.outputs.release == 'true' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Stamp the decided version
        run: node scripts/release.mjs stamp "${{ needs.decide-release.outputs.version }}"

      # The job's `if` is not enough: the runner exposes no
      # GITHUB_REPOSITORY_VISIBILITY of its own, so the policy in release.mjs
      # reads it as unset and refuses to publish from what looks like a private
      # repository. It has to be passed in, the way images.yml passes it.
      - name: Validate the release
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          FACILITY_RELEASE_VERSION: ${{ needs.decide-release.outputs.version }}
        run: node scripts/release.mjs validate

      - name: Pack the release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/facility-release"
          mkdir -p "$release_dir"
          tarball="$(cd packages/cli && npm pack --ignore-scripts --pack-destination "$release_dir")"
          candidate="$release_dir/$tarball"
          node scripts/release.mjs artifact "$candidate"
          echo "path=$candidate" >> "$GITHUB_OUTPUT"

      - name: Install the release candidate and run the binary
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/facility-release-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts --silent "$CANDIDATE"
          ./node_modules/.bin/facility --help

      - name: Preserve the tested release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: facility-release-package
          path: ${{ steps.candidate.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  self-host-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build the documented self-host stack from a clean checkout
        env:
          SECRET_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose build --pull

  sandbox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Apply the sandbox E2E policy
        id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          required=true
          reason="default-branch/release acceptance"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              runner/ \
              services/api/src/sandbox/ \
              services/api/test/sandbox.e2e.test.ts \
              Dockerfile \
              runner/Dockerfile \
              docker-compose.yml \
              docker-compose.dev.yml; then
              required=false
              reason="PR does not change sandbox execution boundaries"
            else
              reason="PR changes sandbox execution boundaries"
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Sandbox E2E required=$required ($reason)"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.policy.outputs.required == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.policy.outputs.required == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.policy.outputs.required == 'true'
        run: pnpm install --frozen-lockfile

      - name: Prepare the isolated sandbox database
        if: steps.policy.outputs.required == 'true'
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait postgres
          if ! docker compose -f docker-compose.dev.yml exec -T postgres \
            psql -U facility -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='facility_sbx'" | grep -qx 1; then
            docker compose -f docker-compose.dev.yml exec -T postgres \
              createdb -U facility facility_sbx
          fi

      - name: Build the runner image
        if: steps.policy.outputs.required == 'true'
        run: docker build --pull -t facility-runner:dev runner

      - name: Exercise the privileged CodeBuild boundary
        if: steps.policy.outputs.required == 'true'
        run: |
          timeout 10m docker run --rm --privileged --user root \
            --entrypoint /app/codebuild-runner.sh \
            --env FACILITY_CODEBUILD_SMOKE=1 \
            facility-runner:dev

      - name: Run the Docker-backed sandbox loop
        if: steps.policy.outputs.required == 'true'
        env:
          DATABASE_URL: postgres://facility:facility@127.0.0.1:5461/facility_sbx
          FACILITY_E2E_DOCKER: "1"
        run: pnpm test:e2e-sandbox

      - name: Record an allowed skip
        if: steps.policy.outputs.required != 'true'
        run: echo "Sandbox E2E skipped by policy — ${{ steps.policy.outputs.reason }}."

  # Keep publication in the original accepted main-push run so npm provenance
  # identifies the commit that passed every acceptance job. A downstream
  # workflow_run would instead attest the default branch SHA.
  publish-npm:
    if: needs.decide-release.outputs.release == 'true' && github.event.repository.visibility == 'public'
    needs: [decide-release, verify, package-release, self-host-build, sandbox-e2e]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.decide-release.outputs.version }}
    # Required for the publish job to see NPM_BOOTSTRAP_TOKEN. Declaring
    # `environment: npm` on that job is not enough on its own: without this, a
    # called workflow resolves every environment-scoped secret to an empty
    # string rather than failing, which is how the first 0.3.1 attempt reached
    # the bootstrap step with no token. The environment still gates the secret —
    # it materializes only in the job that names the environment — and there are
    # no repository or organization secrets here for `inherit` to widen.
    secrets: inherit

  # Publish containers from the same accepted run as npm. The reusable workflow
  # revalidates the release before granting its jobs packages: write.
  publish-images:
    if: needs.decide-release.outputs.release == 'true' && github.event.repository.visibility == 'public'
    needs: [decide-release, verify, package-release, self-host-build, sandbox-e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.decide-release.outputs.version }}

  # The tag is written last, and only after both registries accepted the
  # release. It records what shipped; it is not the request to ship it. Retry a
  # failed publisher in this same run so an already-successful peer is not
  # asked to republish an immutable version.
  record-release:
    needs: [decide-release, publish-npm, publish-images]
    if: needs.decide-release.outputs.release == 'true' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Tag the released commit and publish its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.decide-release.outputs.tag }}
          VERSION: ${{ needs.decide-release.outputs.version }}
          NOTES: ${{ needs.decide-release.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$tag_sha" != "$head_sha" ]; then
              echo "$TAG points to $tag_sha, not released commit $head_sha" >&2
              exit 1
            fi
            echo "$TAG already points to the released commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$VERSION"
            git push origin "$TAG"
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            gh release create "$TAG" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
