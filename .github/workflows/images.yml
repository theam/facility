# Publishes the service images to GHCR so a self-hoster does not have to build
# them. Release publication is called by ci.yml only after every acceptance job
# passes; a manual run publishes a commit-SHA tag and never a version tag. The
# version comes from the commits on main, not from a tag someone pushed.
#
# One Bake graph first pushes five addressable digests without deployable tags.
# Only after the complete graph succeeds does the promote job point the six
# service tags at those digests (worker intentionally reuses api). Existing
# tags are inspected through the GitHub Packages API: an exact digest is
# idempotent, while a conflicting replay fails closed before promotion.
#
# A package is created PRIVATE regardless of the repository's visibility: what
# it inherits from the linked repository is access permissions, not visibility.
# Making each of the six public is a one-time manual step in the package
# settings, after which anyone — including ECS — can pull without authenticating.
# Until then, deployments keep building into their own registry (see the AWS
# runbook), which also stays the right answer for private forks.
# Actions are pinned to full SHAs (guards/actions-pinned.mjs enforces it).
name: images

on:
  workflow_call:
    inputs:
      version:
        description: The version decided from the commits
        type: string
        required: true
    outputs:
      promoted:
        description: Whether every immutable GHCR version tag was promoted
        value: ${{ jobs.promote.outputs.promoted }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # The decided version is not committed, so apply the same stamp the npm
      # archive got before revalidating this isolated checkout. A manual run has
      # no version and publishes only a commit-SHA tag.
      - name: Stamp the decided version
        if: inputs.version != ''
        run: node scripts/release.mjs stamp "${{ inputs.version }}"

      - name: Validate the publication policy
        id: plan
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          FACILITY_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/images.mjs plan

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The plan job's stamp cannot cross the job boundary. Stamp this isolated
      # checkout so every target contains the version on its promoted tag.
      - name: Stamp the decided version
        if: inputs.version != ''
        run: node scripts/release.mjs stamp "${{ inputs.version }}"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Shell steps do not receive the cache runtime credentials that JavaScript
      # actions receive. Export them before raw Buildx uses the type=gha cache.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # linux/amd64 only, matching the module's default task_cpu_architecture.
      # A single graph shares base, dependency, and workspace stages across the
      # five thin security-boundary images. The overlay pushes only canonical
      # digests; release tags remain gated by the promote job.
      - name: Build and push the addressable image set
        env:
          ECR_REGISTRY: ghcr.io
          ECR_PREFIX: ${{ github.repository }}
          IMAGE_TAG: unused-by-publish-overlay
          PLATFORM: linux/amd64
          PUBLISH_REGISTRY: ghcr.io
          PUBLISH_PREFIX: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/image-build-metadata.json"
          (
            cd infra
            docker buildx bake \
              --allow=fs.read=.. \
              --file docker-bake.hcl \
              --file docker-bake.publish.hcl \
              --metadata-file "$metadata"
          )
          node scripts/images.mjs record-bake-digests \
            "$metadata" "$RUNNER_TEMP/image-digests"

      - name: Preserve the complete digest set for promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: facility-image-digests-${{ github.sha }}
          path: ${{ runner.temp }}/image-digests/*.json
          if-no-files-found: error
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: facility-image-digests-${{ github.sha }}
          path: ${{ runner.temp }}/image-digests

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pin both the scanner version and release-asset checksum. This avoids a
      # downloader action whose pinned JavaScript still executes an installer
      # from a mutable upstream branch.
      - id: grype
        name: Install the checksum-pinned Grype scanner
        env:
          GRYPE_SHA256: aaa98d27d2d7efd9317c6a1ad6d9b15f3e65bab320e7d03bde41e251387bb71c
          GRYPE_VERSION: 0.110.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/grype.tar.gz"
          directory="$RUNNER_TEMP/grype"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anchore/grype/releases/download/v$GRYPE_VERSION/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GRYPE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$directory" grype
          chmod 0755 "$directory/grype"
          printf 'cmd=%s\n' "$directory/grype" >> "$GITHUB_OUTPUT"

      # Download the vulnerability database once. The five scans below then
      # reuse it and the runner's container-layer cache.
      - name: Refresh the Grype vulnerability database once
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: '"$GRYPE" db update'

      - name: Gate every addressable image digest on fixable high CVEs
        env:
          DIGEST_DIRECTORY: ${{ runner.temp }}/image-digests
          GRYPE: ${{ steps.grype.outputs.cmd }}
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          GRYPE_DB_AUTO_UPDATE: "false"
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          scan_failed=0
          for image in api gateway mcp web runner; do
            digest="$(node -e '
              const fs = require("node:fs");
              const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (manifest.image !== process.argv[2] || !/^sha256:[0-9a-f]{64}$/.test(manifest.digest)) {
                throw new Error(`invalid digest manifest for ${process.argv[2]}`);
              }
              process.stdout.write(manifest.digest);
            ' "$DIGEST_DIRECTORY/$image.json" "$image")"
            grype_config=()
            if [[ "$image" == "runner" ]]; then
              grype_config=(--config "$GITHUB_WORKSPACE/runner/grype.yaml")
            fi
            # Service scans run outside the checkout so a future repository
            # config cannot silently weaken them. Only runner receives the
            # explicit, path- and version-pinned upstream-binary policy.
            if ! (cd "$RUNNER_TEMP" && "$GRYPE" "${grype_config[@]}" \
              "registry:$IMAGE_PREFIX/$image@$digest" --fail-on high --only-fixed); then
              scan_failed=1
            fi
          done
          exit "$scan_failed"

  promote:
    needs: [plan, build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      promoted: ${{ steps.promotion.outputs.promoted }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download every accepted digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: facility-image-digests-${{ github.sha }}
          path: ${{ runner.temp }}/image-digests

      - name: Promote the complete image set
        env:
          GITHUB_REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAGS_JSON: ${{ needs.plan.outputs.tags }}
        run: node scripts/images.mjs promote "$RUNNER_TEMP/image-digests"

      - name: Record the promoted image version
        id: promotion
        run: echo 'promoted=true' >> "$GITHUB_OUTPUT"
