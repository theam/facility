# Publishes the service images to GHCR so a self-hoster does not have to build
# them. Release publication is called by ci.yml only after every acceptance job
# passes; a manual run publishes a commit-SHA tag and never a version tag. The
# version comes from the commits on main, not from a tag someone pushed.
#
# Builds first push addressable digests without deployable tags. Only after all
# five builds succeed does the promote job point the six service tags at those
# digests (worker intentionally reuses api). Existing tags are inspected through
# the GitHub Packages API: an exact digest is idempotent, while a conflicting
# replay fails closed before promotion.
#
# A package is created PRIVATE regardless of the repository's visibility: what
# it inherits from the linked repository is access permissions, not visibility.
# Making each of the six public is a one-time manual step in the package
# settings, after which anyone — including ECS — can pull without authenticating.
# Until then, deployments keep building into their own registry (see the AWS
# runbook), which also stays the right answer for private forks.
# Actions are pinned to full SHAs (guards/actions-pinned.mjs enforces it).
name: images

on:
  workflow_call:
    inputs:
      version:
        description: The version decided from the commits
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # The decided version is not committed, so apply the same stamp the npm
      # archive got before revalidating this isolated checkout. A manual run has
      # no version and publishes only a commit-SHA tag.
      - name: Stamp the decided version
        if: inputs.version != ''
        run: node scripts/release.mjs stamp "${{ inputs.version }}"

      - name: Validate the publication policy
        id: plan
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          FACILITY_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/images.mjs plan

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # api carries the worker and the migrate task as well: same bits, a
          # different command. The worker tags are promoted from this digest.
          - image: api
            dockerfile: Dockerfile
            target: api
            context: .
          - image: gateway
            dockerfile: Dockerfile
            target: gateway
            context: .
          - image: mcp
            dockerfile: Dockerfile
            target: mcp
            context: .
          - image: web
            dockerfile: apps/web/Dockerfile
            target: web
            context: .
          - image: runner
            dockerfile: runner/Dockerfile
            target: ""
            context: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The plan job's stamp cannot cross the job boundary. Stamp every matrix
      # checkout so the built image contains the version on its promoted tag.
      - name: Stamp the decided version
        if: inputs.version != ''
        run: node scripts/release.mjs stamp "${{ inputs.version }}"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only, matching the module's default task_cpu_architecture.
      # Graviton deployments still build their own until arm64 is added here.
      - name: Build and push the addressable digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record the built digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
        run: node scripts/images.mjs record-digest "$IMAGE_NAME" "$IMAGE_DIGEST" "$RUNNER_TEMP/image-digests"

      - name: Preserve the digest for promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: facility-image-${{ matrix.image }}-${{ github.sha }}
          path: ${{ runner.temp }}/image-digests/${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 1

  promote:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download every accepted digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: facility-image-*-${{ github.sha }}
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true

      - name: Promote the complete image set
        env:
          GITHUB_REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAGS_JSON: ${{ needs.plan.outputs.tags }}
        run: node scripts/images.mjs promote "$RUNNER_TEMP/image-digests"
