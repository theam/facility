packages:
  - apps/*
  - services/*
  - packages/*
  - runner

# The Docusaurus webpack path still accepts the serialize-javascript API but
# resolves a vulnerable v6 without this workspace-wide security floor.
overrides:
  "serialize-javascript@<=7.0.2": 7.0.7

# Postinstall build-script allowlist — nothing builds unless named here
# (the tam-os supply-chain convention).
allowBuilds:
  sharp: true
  argon2: true
  esbuild: true
  libsodium-wrappers-sumo: true
  better-sqlite3: false
  core-js: false
  # dockerode optional SSH-transport native deps — unused (we use the socket).
  cpu-features: false
  protobufjs: false
  ssh2: false
