packages:
  - apps/*
  - services/*
  - packages/*
  - runner

# The Docusaurus webpack path still accepts the serialize-javascript API but
# resolves a vulnerable v6 without this workspace-wide security floor.
overrides:
  "esbuild@>=0.27.3 <0.28.1": 0.28.1
  "postcss@<8.5.23": 8.5.23
  "serialize-javascript@<=7.0.2": 7.0.7
  "uuid@<11.1.1": 11.1.1
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
  "@fastify/static@<10.1.2": 10.1.2
  "fast-uri@>=3.0.0 <3.1.5": 3.1.5
  "find-my-way@<9.6.1": 9.7.0
  "js-yaml@>=4.0.0 <4.3.0": 4.3.0
  "sharp@<0.35.0": 0.35.0
  "svgo@>=3.0.0 <3.3.4": 3.3.4
  "body-parser@<1.20.6": 1.20.6
  "@hono/node-server@<2.0.10": 2.0.10
  "hono@<4.12.34": 4.12.34
  "ip-address@<10.3.1": 10.3.1
  "protobufjs@>=7.5.0 <7.6.5": 7.6.5
  "webpack-dev-server@<=5.2.5": 5.2.6

# Postinstall build-script allowlist — nothing builds unless named here.
allowBuilds:
  sharp: true
  argon2: true
  esbuild: true
  libsodium-wrappers-sumo: true
  better-sqlite3: false
  core-js: false
  # dockerode optional SSH-transport native deps — unused (we use the socket).
  cpu-features: false
  protobufjs: false
  ssh2: false

# brace-expansion OOM advisory (GHSA-mh99-v99m-4gvg): only patched in v5; v5's CJS export is
# an object, incompatible with minimatch@3's callable import (docusaurus dev
# server chain, dev-only). The 1.x/2.x lines are pinned to their own latest.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
