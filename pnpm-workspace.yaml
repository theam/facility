packages:
  - apps/*
  - services/*
  - packages/*
  - runner

# Workspace-wide security floors for transitive dependencies.
overrides:
  "browserslist@<4.28.7": 4.28.7
  "esbuild@>=0.27.3 <0.28.1": 0.28.1
  "postcss@<8.5.23": 8.5.23
  # The Docusaurus webpack path still accepts the serialize-javascript API but
  # resolves a vulnerable v6 without this floor.
  "serialize-javascript@<=7.0.2": 7.0.7
  "uuid@<11.1.1": 11.1.1
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
  "@fastify/static@<10.1.2": 10.1.2
  "fast-uri@>=3.0.0 <3.1.6": 3.1.6
  "find-my-way@<9.6.1": 9.7.0
  "js-yaml@>=3.0.0 <3.15.1": 3.15.1
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  "sharp@<0.35.0": 0.35.0
  "svgo@>=3.0.0 <3.3.4": 3.3.4
  "body-parser@<1.20.6": 1.20.6
  "@hono/node-server@<2.0.10": 2.0.10
  "hono@<4.12.34": 4.12.34
  "ip-address@<10.3.1": 10.3.1
  "protobufjs@>=7.5.0 <7.6.5": 7.6.5
  "webpack-dev-server@<=5.2.5": 5.2.6
  "dompurify@<=3.4.12": 3.4.13
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  # Only reached through the Docusaurus dev server's Express stack. One floor
  # covers both open advisories; the later one supersedes the 6.15.4 fix.
  "qs@<6.16.0": 6.16.0

# Postinstall build-script allowlist — nothing builds unless named here.
allowBuilds:
  sharp: true
  argon2: true
  esbuild: true
  libsodium-wrappers-sumo: true
  better-sqlite3: false
  core-js: false
  # dockerode optional SSH-transport native deps — unused (we use the socket).
  cpu-features: false
  protobufjs: false
  ssh2: false

# The advisory database still flags brace-expansion 1.x/2.x for GHSA-mh99-v99m-4gvg,
# although 1.1.18 and 2.1.4 contain the bounded-expansion backport. Keep this temporary
# ignore only while those patched legacy lines are required by the current dependency graph.
# image-size has no upstream fixed release for its zero-length ICNS/HEIF/JXL loops.
# The local patch adds progress guards, covered by dependencies-security.test.mjs.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

minimumReleaseAgeExclude:
  - '@vercel/sandbox@3.0.0'

patchedDependencies:
  image-size@2.0.2: patches/image-size@2.0.2.patch

# Filtered production-image installs intentionally omit the docs-only patched
# dependency. Keep full repository installs strict and open this exception only
# in those Docker build stages.
allowUnusedPatches: ${FACILITY_ALLOW_UNUSED_PATCHES-false}
