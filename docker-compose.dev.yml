# Local development infrastructure for the Facility platform.
#   docker compose -f docker-compose.dev.yml up -d
# Postgres is the only persistent control-plane dependency. Story workspaces
# run through the selected workspace provider.
name: facility-dev

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5461:5432"
    environment:
      POSTGRES_USER: facility
      POSTGRES_PASSWORD: facility
      POSTGRES_DB: facility
    volumes:
      - facility-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facility"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  facility-pg:
